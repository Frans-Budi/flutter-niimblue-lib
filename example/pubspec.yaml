name: niim_blue_flutter_example
description: Example app for niim_blue_flutter library
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  niim_blue_flutter:
    path: ../
  flutter_blue_plus: ^2.3.12
  image: ^4.6.0
  permission_handler: ^13.0.2
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
